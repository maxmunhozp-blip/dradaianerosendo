name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Lint, typecheck & dedupe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Verify @tiptap/core dedupe (single version)
        run: bun run check:deps

      - name: Verify @tiptap/core module + type resolution
        run: bun run check:tiptap

      - name: TypeScript typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Vitest
        run: bun run test

      - name: Build
        run: bun run build
